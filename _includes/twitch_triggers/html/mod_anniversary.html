<form id="SAMMITestTwitchModAnniversary" class="SAMMITestTriggers">
  <div>
    <button type="submit" class="btn btn-primary btn-sm me-1">Mod Anniversary</button>
    <a class="tslCollapse collapsed" data-bs-toggle="collapse" href="#hidemodanniversary" role="button" aria-expanded="false" aria-controls="hidemodanniversary"></a>
  </div>
  <div class="collapse" id="hidemodanniversary" data-bs-parent="#content-triggers">
    <div class="form-group mb-2">
      <label>Username:</label>
      <input type="text" class="form-control form-control-sm w-auto" name="name">
    </div>
    <div class="form-group mb-2">
      <label>Months:</label>
      <input type="number" class="form-control form-control-sm w-auto" min="1" max="999" name="modAnniversaryMonths" value=6>
    </div>
    <div class="form-group mb-2">
      <label>Message:</label>
      <textarea class="form-control form-control-sm w-75" rows="1" name="modAnniversaryMessage"></textarea>
    </div>
  </div>
</form>
